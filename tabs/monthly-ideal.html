<div class="sheet-body">

    <div class="left-col">

        <!-- Income box -->
        <div class="box">
            <div class="box-title">Income</div>
            <div class="income-cols">

                <!-- Col 1: Pretax Annual + Pretax Monthly (read-only) -->
                <div class="income-stack">
                    <div class="income-section pretax-annual">
                        <div class="section-total">Pretax Annual: <span id="annualTotal">$0</span></div>
                        <div class="box-row"><label>Base</label>            <span class="val-display">$<span id="baseDisplay">0</span></span></div>
                        <div class="box-row"><label>Stock Refresher</label> <span class="val-display">$<span id="refresherDisplay">0</span></span></div>
                        <div class="box-row"><label>RSU</label>             <span class="val-display">$<span id="rsuDisplay">0</span></span></div>
                        <div class="box-row">
                            <label>Bonus (<span class="bonus-pct-lbl">8</span>% base)</label>
                            <span class="val-display">$<span id="bonusAnnualDisplay">0</span></span>
                        </div>
                    </div>
                    <div class="income-section pretax-monthly">
                        <div class="section-total">Pretax Monthly: <span id="preTaxMonthlyTotal">$0</span></div>
                        <div class="box-row"><label>Base</label>            <span class="val-display">$<span id="baseMonthlyDisplay">0</span></span></div>
                        <div class="box-row"><label>RSU</label>             <span id="rsu1MonthlyDisplay"></span></div>
                        <div class="box-row"><label>Stock Refresher</label> <span id="rsu2MonthlyDisplay"></span></div>
                        <div class="box-row">
                            <label>Bonus (<span class="bonus-pct-lbl">8</span>% base)</label>
                            <span class="val-display">$<span id="bonusMonthlyDisplay">0</span></span>
                        </div>
                    </div>
                </div>

                <!-- Col 2: PostTax Annual + PostTax Monthly -->
                <div class="income-stack">
                    <div class="income-section posttax-annual">
                        <div class="section-total">PostTax Annual: $<span id="postTaxAnnual">0</span></div>
                        <div class="section-content-row">
                            <div class="section-rows">
                                <div class="box-row"><label>Base</label>
                                    <span>−$<span id="baseTaxAmt">0</span> = $<span id="baseNet">0</span></span></div>
                                <div class="box-row"><label>Stock Refresher</label>
                                    <span>−$<span id="refresherTaxAmt">0</span> = $<span id="refresherNet">0</span></span></div>
                                <div class="box-row"><label>RSU</label>
                                    <span>−$<span id="rsuTaxAmt">0</span> = $<span id="rsuNet">0</span></span></div>
                                <div class="box-row">
                                    <label>Bonus (<span class="bonus-pct-lbl">8</span>% base)</label>
                                    <span>−$<span id="bonusTaxAmt">0</span> = $<span id="bonusNet">0</span></span>
                                </div>
                                <div class="box-row total-row"><label>Total Tax Cut</label>
                                    <span>−$<span id="totalTaxAmt">0</span></span></div>
                            </div>
                            <div class="tax-rate-info" id="taxRateNoteAnnual"></div>
                        </div>
                    </div>
                    <div class="income-section posttax-monthly">
                        <div class="section-total">PostTax Monthly: $<span id="postTaxMonthly">0</span></div>
                        <div class="section-content-row">
                            <div class="section-rows">
                                <div class="box-row"><label>Base</label>
                                    <span>−$<span id="baseMonthlyTax">0</span> = $<span id="baseMonthlyNet">0</span></span></div>
                                <div class="box-row"><label>RSU</label>             <span id="rsu1MonthlyPostDisplay"></span></div>
                                <div class="box-row"><label>Stock Refresher</label> <span id="rsu2MonthlyPostDisplay"></span></div>
                                <div class="box-row">
                                    <label>Bonus (<span class="bonus-pct-lbl">8</span>% base)</label>
                                    <span>−$<span id="bonusMonthlyTax">0</span> = $<span id="bonusMonthlyNet">0</span></span>
                                </div>
                                <div class="box-row total-row"><label>Total Tax Cut</label>
                                    <span>−$<span id="totalMonthlyTaxAmt">0</span></span></div>
                            </div>
                            <div class="tax-rate-info" id="taxRateNoteMonthly"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Savings box -->
        <div class="box">
            <div class="box-title">Savings</div>
            <div class="box-body">
                <div class="box-row"><label>Roth IRA</label>                <span class="money-wrap">$<input class="val-input" type="number" id="rothIRA"  value="0" oninput="calculate()"></span></div>
                <div class="box-row"><label>HSA</label>                     <span class="money-wrap">$<input class="val-input" type="number" id="hsa"      value="0" oninput="calculate()"></span></div>
                <div class="box-row"><label>Fidelity Stock Portfolio</label> <span class="money-wrap">$<input class="val-input" type="number" id="fidelity" value="0" oninput="calculate()"></span></div>
            </div>
        </div>

    </div>

    <!-- Right column -->
    <div class="right-col">
        <div class="avg-block">
            <div class="avg-label">Monthly Average</div>
            <div class="avg-value"><span id="monthlyAvg">$0</span></div>
        </div>
        <!-- Tithing box -->
        <div class="box">
            <div class="box-title">Tithing</div>
            <div class="box-body">
                <div class="box-row"><label>Church (<span id="churchPctDisp">3.5</span>%)</label>    <span>$<span id="titheChurch">0</span></span></div>
                <div class="box-row"><label>TCBC (<span id="tcbcPctDisp">3.5</span>%)</label>        <span>$<span id="titheTCBC">0</span></span></div>
                <div class="box-row"><label>IV (<span id="ivPctDisp">2</span>%)</label>              <span>$<span id="titheIV">0</span></span></div>
                <div class="box-row"><label>Cornell_Kcc (<span id="kccPctDisp">1</span>%)</label>    <span>$<span id="titheKcc">0</span></span></div>
                <div class="box-row total-row">
                    <label>Total (<span id="titheTotalPctDisp">10</span>%)</label>
                    <span>$<span id="titheTotal">0</span></span>
                </div>
            </div>
        </div>
        <div class="box">
            <div class="box-title">Monthly Expenses — Total: $<span id="expTotal">0</span></div>
            <div class="box-body">
                <div id="idealExpenseList"></div>
                <div class="box-row sub-auto-row">
                    <label>Subscriptions (auto)</label>
                    <span>$<span id="subTotalDisplay">0</span></span>
                </div>
            </div>
        </div>
    </div>

</div>
