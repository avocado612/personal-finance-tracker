<div class="sheet-body">
    <div class="box">
        <div class="box-title">Edit</div>
        <div class="box-body">

            <div class="edit-divider">Income</div>
            <div class="box-row"><label>Base Salary</label>     <span class="money-wrap">$<input class="val-input" type="number" id="base"      value="115300" oninput="calculate()"></span></div>
            <div class="box-row"><label>Stock Refresher</label> <span class="money-wrap">$<input class="val-input" type="number" id="refresher" value="20000"  oninput="calculate()"></span></div>
            <div class="box-row"><label>RSU</label>             <span class="money-wrap">$<input class="val-input" type="number" id="rsu"        value="20000"  oninput="calculate()"></span></div>
            <div class="box-row"><label>Bonus % of Base</label> <span class="pct-wrap"><input class="pct-input" type="number" id="bonusPct" value="8" step="0.1" oninput="calculate()">%</span></div>

            <div class="edit-divider">Tax Rates</div>
            <div class="box-row"><label>Federal Tax</label>     <span class="pct-wrap"><input class="pct-input" type="number" id="taxFed"   value="22"   step="0.1" oninput="calculate()">%</span></div>
            <div class="box-row"><label>State Tax</label>       <span class="pct-wrap"><input class="pct-input" type="number" id="taxState" value="5"    step="0.1" oninput="calculate()">%</span></div>
            <div class="box-row"><label>Social Security</label> <span class="pct-wrap"><input class="pct-input" type="number" id="taxSS"    value="6.2"  step="0.1" oninput="calculate()">%</span></div>
            <div class="box-row"><label>Medicare</label>        <span class="pct-wrap"><input class="pct-input" type="number" id="taxMed"   value="1.45" step="0.1" oninput="calculate()">%</span></div>

            <div class="edit-divider">Tithing Rates</div>
            <div class="box-row"><label>Church</label>      <span class="pct-wrap"><input class="pct-input" type="number" id="titheChurchPct" value="3.5" step="0.1" oninput="calculate()">%</span></div>
            <div class="box-row"><label>TCBC</label>        <span class="pct-wrap"><input class="pct-input" type="number" id="titheTCBCPct"  value="3.5" step="0.1" oninput="calculate()">%</span></div>
            <div class="box-row"><label>IV</label>          <span class="pct-wrap"><input class="pct-input" type="number" id="titheIVPct"    value="2"   step="0.1" oninput="calculate()">%</span></div>
            <div class="box-row"><label>Cornell_Kcc</label> <span class="pct-wrap"><input class="pct-input" type="number" id="titheKccPct"   value="1"   step="0.1" oninput="calculate()">%</span></div>

            <div class="edit-divider">Monthly Expenses</div>
            <div id="editExpenseList"></div>
            <button class="add-btn" onclick="addExpense()">+ Add Expense</button>

            <div class="edit-divider">Subscriptions</div>
            <div id="editSubList"></div>
            <button class="add-btn" onclick="addSubscription()">+ Add Subscription</button>

            <div class="edit-divider">Custom Category Keywords</div>
            <div style="font-size:12px; color:#888; margin-bottom:8px;">Add keywords under each category — matched against CC transactions before built-in rules</div>
            <div id="editCustomKeywords"></div>

        </div>
    </div>
</div>
